# Stages D and E: an Ollama orchestrator delegating to a Hugging Face worker on the GPU (mixed providers).
# Names wrapped in double underscores are placeholders filled in by rtx4070.py; never edit the rendered copies by hand.
# The worker's device is "cuda" ON PURPOSE and is not a placeholder: if CUDA is missing the load fails, it never runs on CPU.
workspace: "__WORKSPACE__"

limits:
  max_delegations: 2
  max_report_chars: 3000
  worker_timeout_s: 600

orchestrator:
  model:
    provider: ollama
    model: "__OLLAMA_MODEL__"
    quantization: server
    context_length: __OLLAMA_CTX__
    base_url: "__OLLAMA_BASE_URL__"
  tools: []
  max_iterations: 6
  system_prompt: >-
    You coordinate worker agents. Split the user's task into self-contained pieces, delegate them
    with the delegate tool, and answer from the workers' reports.

workers:
  - name: "__WORKER_NAME__"
    description: "__WORKER_DESCRIPTION__"
    model:
      provider: hf
      model: "__HF_MODEL__"            # local snapshot path of the pinned revision (no download at run time)
      quantization: __HF_QUANT__       # bnb-4bit-nf4 (primary) or none (fallback)
      dtype: __HF_DTYPE__              # bf16 (primary) or fp16 (fallback)
      device: cuda
    tools: __WORKER_TOOLS__
    max_iterations: 8
